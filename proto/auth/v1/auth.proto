syntax = "proto3";

package auth.v1;

option java_multiple_files = true;
option java_package = "com.example.auth.proto.v1";
option java_outer_classname = "AuthProto";

service AuthService {
  rpc Login (LoginRequest) returns (LoginResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string message = 2;
}
